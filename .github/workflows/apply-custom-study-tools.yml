name: Apply Custom Study Tools

on:
  push:
    branches:
      - agent/custom-study-tools

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-study-tools
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # 1) No artificial reviewer delays.
          replace(
              "AmgiApp/Sources/Review/ReviewSession.swift",
              '''            // The toast stays up at least this long; the next card appears\n            // after max(backend round-trip, toast display).\n            let minToastDisplay = Task { try? await Task.sleep(for: .milliseconds(450)) }\n''',
              ""
          )
          p = Path("AmgiApp/Sources/Review/ReviewSession.swift")
          text = p.read_text()
          if text.count("                await minToastDisplay.value\n") != 2:
              raise SystemExit("expected exactly two minToastDisplay awaits")
          p.write_text(text.replace("                await minToastDisplay.value\n", ""))

          Path("AmgiApp/Sources/Review/FlipContainer.swift").write_text('''import SwiftUI

/// Immediate answer reveal for the native card surface.
///
/// Both reveal and reset deliberately disable animation so the visible side
/// follows `showBack` with zero artificial transition time.
struct FlipContainer<Content: View>: View {
    let showBack: Bool
    @ViewBuilder let content: (_ isBack: Bool) -> Content

    var body: some View {
        content(showBack)
            .id(showBack)
            .transaction { transaction in
                transaction.disablesAnimations = true
            }
    }
}
''')

          # 2) Backend requests used by photo import and full-deck reset.
          Path("Sources/AnkiProtoBridge/Requests/CardSearchRequests.swift").write_text('''import Foundation
public import AnkiBackend
public import AnkiKit
import AnkiProto
import SwiftProtobuf

extension Request where Response == [CardID] {
    /// Runs an Anki card search and returns matching card IDs.
    public static func searchCardIds(query: String) -> Self {
        Self(
            serviceId: ServiceID.search,
            methodId: SearchMethod.searchCards,
            encode: {
                var proto = Anki_Search_SearchRequest()
                proto.search = query.isEmpty ? "deck:*" : query
                return try proto.serializedData()
            },
            decode: { bytes in
                let response = try Anki_Search_SearchResponse(serializedBytes: bytes)
                return response.ids.map(CardID.init)
            }
        )
    }
}
''')

          Path("Sources/AnkiProtoBridge/Requests/MediaAddRequests.swift").write_text('''import Foundation
public import AnkiBackend
public import AnkiKit
import AnkiProto
import SwiftProtobuf

extension Request where Response == String {
    /// Adds bytes through Anki's media service and returns the actual stored
    /// filename (the backend may rename it to avoid a collision).
    public static func addMediaFile(data: Data, desiredName: String) -> Self {
        Self(
            serviceId: ServiceID.media,
            methodId: MediaMethod.addMediaFile,
            encode: {
                var proto = Anki_Media_AddMediaFileRequest()
                proto.desiredName = desiredName
                proto.data = data
                return try proto.serializedData()
            },
            decode: { bytes in
                try Anki_Generic_String(serializedBytes: bytes).val
            }
        )
    }
}
''')

          Path("Sources/AnkiClients/MediaImportClient.swift").write_text('''import AnkiBackend
