          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-custom-study-tools.yml
          git add \
            AmgiApp/Sources/Review/ReviewSession.swift \
            AmgiApp/Sources/Review/FlipContainer.swift \
            AmgiApp/Sources/Browse/AddNoteView.swift \
            AmgiApp/Sources/Browse/NoteEditorView.swift \
