}

extension MediaImportClient: TestDependencyKey {
    public static let testValue = MediaImportClient()
}

extension DependencyValues {
    public var mediaImportClient: MediaImportClient {
        get { self[MediaImportClient.self] }
        set { self[MediaImportClient.self] = newValue }
    }
}
''')

          Path("Sources/AnkiClients/DeckResetClient.swift").write_text('''import AnkiBackend
import AnkiKit
import AnkiProtoBridge
public import Dependencies
import DependenciesMacros

@DependencyClient
public struct DeckResetClient: Sendable {
    /// Resets every card matched by the deck search to Anki's New state and
    /// returns the number of cards changed.
    public var resetEntireDeck: @Sendable (_ deckName: String) async throws -> Int
}

extension DeckResetClient: DependencyKey {
    public static let liveValue: Self = {
        @Dependency(\\.ankiBackend) var backend
        return Self(
            resetEntireDeck: { deckName in
                try await backendOffload {
                    let escaped = deckName
                        .replacingOccurrences(of: "\\\\", with: "\\\\\\\\")
                        .replacingOccurrences(of: "\\\"", with: "\\\\\\\"")
                    let cardIds = try backend.invoke(.searchCardIds(query: "deck:\\\"\\(escaped)\\\""))
                    guard !cardIds.isEmpty else { return 0 }
                    try backend.invoke(.scheduleCardsAsNew(cardIds: cardIds, log: true))
                    return cardIds.count
                }
            }
        )
    }()
}

extension DeckResetClient: TestDependencyKey {
    public static let testValue = DeckResetClient()
}

extension DependencyValues {
    public var deckResetClient: DeckResetClient {
        get { self[DeckResetClient.self] }
        set { self[DeckResetClient.self] = newValue }
    }
}
''')

          # 3) Photo picker for ordinary Add/Edit Note fields.
          Path("AmgiApp/Sources/Browse/PhotoAttachmentButton.swift").write_text('''import AnkiClients
import Dependencies
import Foundation
import PhotosUI
import SwiftUI
import UIKit

struct PhotoAttachmentButton: View {
    @Binding var htmlText: String

    @Dependency(\\.mediaImportClient) private var mediaImportClient
    @State private var selectedItem: PhotosPickerItem?
    @State private var isImporting = false
    @State private var errorMessage: String?

    var body: some View {
        VStack(alignment: .leading, spacing: 4) {
            PhotosPicker(selection: $selectedItem, matching: .images) {
                Label(isImporting ? "Adding Image..." : "Add Image", systemImage: "photo.badge.plus")
                    .font(.caption)
            }
            .buttonStyle(.borderless)
            .disabled(isImporting)
            .onChange(of: selectedItem) { _, newItem in
                guard let newItem else { return }
                Task { await importPhoto(newItem) }
            }

            if let errorMessage {
                Text(errorMessage)
                    .font(.caption2)
                    .foregroundStyle(.red)
            }
        }
    }

    @MainActor
    private func importPhoto(_ item: PhotosPickerItem) async {
        isImporting = true
        errorMessage = nil
        defer {
            isImporting = false
            selectedItem = nil
        }

        do {
            guard let sourceData = try await item.loadTransferable(type: Data.self),
                  let image = UIImage(data: sourceData),
                  let jpegData = image.jpegData(compressionQuality: 0.92) else {
                throw PhotoAttachmentError.unreadableImage
            }

            let desiredName = "amgi-\\(UUID().uuidString).jpg"
            let storedName = try await mediaImportClient.add(jpegData, desiredName)
            let escapedName = storedName
                .replacingOccurrences(of: "&", with: "&amp;")
                .replacingOccurrences(of: "\\\"", with: "&quot;")
            let imageTag = "<img src=\\\"\\(escapedName)\\\">"
            htmlText += htmlText.isEmpty ? imageTag : "<br>\\(imageTag)"
        } catch {
            errorMessage = "Could not attach image: \\(error.localizedDescription)"
        }
    }
}

private enum PhotoAttachmentError: LocalizedError {
    case unreadableImage

    var errorDescription: String? {
        "The selected photo could not be converted to an image."
    }
}
''')

