name: Agent Custom Study Build

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/custom-study-tools'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Checkout feature branch with submodules
        uses: actions/checkout@v4
        with:
          ref: agent/custom-study-tools
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
          key: ${{ runner.os }}-anki-rust-${{ hashFiles('anki-bridge-rs/Cargo.lock') }}

      - name: Install build dependencies
        run: brew install protobuf swift-protobuf xcodegen

      - name: Build simulator Rust XCFramework
        run: |
          set -euo pipefail
          export PROTOC="$(which protoc)"
          export IPHONEOS_DEPLOYMENT_TARGET="17.0"
          BRIDGE_DIR="$GITHUB_WORKSPACE/anki-bridge-rs"
          HEADER_DIR="$BRIDGE_DIR/include"
          SIM_LIB="$BRIDGE_DIR/target/aarch64-apple-ios-sim/release/libanki_bridge_ios.a"
          cargo build \
            --manifest-path "$BRIDGE_DIR/Cargo.toml" \
            --target aarch64-apple-ios-sim \
            --release
          test -f "$SIM_LIB"
          rm -rf "$GITHUB_WORKSPACE/AnkiRust.xcframework"
          xcodebuild -create-xcframework \
            -library "$SIM_LIB" -headers "$HEADER_DIR" \
            -output "$GITHUB_WORKSPACE/AnkiRust.xcframework"
          for HEADERS in "$GITHUB_WORKSPACE"/AnkiRust.xcframework/*/Headers; do
            printf '%s\n' \
              'module AnkiRustLib {' \
              '    header "anki_bridge.h"' \
              '    export *' \
              '}' > "$HEADERS/module.modulemap"
          done

      - name: Generate Swift protobuf types
        run: |
          chmod +x ./scripts/generate-protos.sh
          ./scripts/generate-protos.sh

      - name: Generate Xcode project
        run: cd AmgiApp && xcodegen generate

      - name: Compile Debug simulator target
        run: |
          set -o pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          if xcodebuild -list -project AmgiApp/AmgiApp.xcodeproj | grep -q "AmgiAppTests"; then
            xcodebuild build-for-testing \
              -project AmgiApp/AmgiApp.xcodeproj \
              -scheme AmgiApp \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee simulator-build.log
          else
            xcodebuild build \
              -project AmgiApp/AmgiApp.xcodeproj \
              -scheme AmgiApp \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee simulator-build.log
          fi

      - name: Report compile errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f simulator-build.log ]; then
            {
              echo 'Build failed. Relevant compiler output:'
              echo '```text'
              grep -E '(^|[ /])[^ ]+\.swift:[0-9]+:[0-9]+: (error|warning):| error: ' simulator-build.log | tail -n 100 || true
              echo '```'
            } > /tmp/build-comment.md
          else
            echo 'Build failed before the Xcode compile log was created.' > /tmp/build-comment.md
          fi
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/build-comment.md
