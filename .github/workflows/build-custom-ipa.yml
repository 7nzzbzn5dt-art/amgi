name: Build Custom Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - agent/custom-study-tools
  pull_request:
    branches:
      - main

concurrency:
  group: custom-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SKIP_WATCHOS: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-custom-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-custom-rust-1.95-
            ${{ runner.os }}-custom-rust-

      - name: Install build dependencies
        run: brew install protobuf swift-protobuf xcodegen

      - name: Build Rust XCFramework
        run: |
          chmod +x ./scripts/build-xcframework.sh
          ./scripts/build-xcframework.sh

      - name: Generate Swift protobuf types
        run: |
          chmod +x ./scripts/generate-protos.sh
          ./scripts/generate-protos.sh

      - name: Generate Xcode project
        run: cd AmgiApp && xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AmgiApp.xcarchive" \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/AmgiApp.xcarchive/Products/Applications" -name '*.app' | head -1)
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r AmgiApp-custom-unsigned.ipa Payload
          shasum -a 256 AmgiApp-custom-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AmgiApp-custom-unsigned-ipa
          path: ${{ runner.temp }}/AmgiApp-custom-unsigned.ipa
          retention-days: 7
